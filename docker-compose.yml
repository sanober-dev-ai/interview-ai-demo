version: "3.3"

services:
  mongodb:
    image: mongo:7
    container_name: interview-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin

  redis:
    image: redis:7
    container_name: interview-redis
    restart: always
    ports:
      - "6378:6378"
